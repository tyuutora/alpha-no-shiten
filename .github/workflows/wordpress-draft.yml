name: WordPress draft sync

on:
  push:
    branches:
      - main
    paths:
      - "articles/**/*.md"
      - "articles/images/**"
  workflow_dispatch:
    inputs:
      article_path:
        description: "Markdown file to send as a draft, for example articles/fe85gm2-review.md"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wordpress-draft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-drafts:
    name: Save WordPress drafts
    runs-on: ubuntu-latest
    steps:
      - name: Check out content
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate WordPress settings
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          : "${WP_BASE_URL:?Set the WP_BASE_URL repository secret.}"
          : "${WP_USERNAME:?Set the WP_USERNAME repository secret.}"
          : "${WP_APP_PASSWORD:?Set the WP_APP_PASSWORD repository secret.}"

      - name: Create or update WordPress drafts
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_DEFAULT_CATEGORY_IDS: ${{ vars.WP_DEFAULT_CATEGORY_IDS }}
          WP_DEFAULT_CATEGORY_SLUGS: ${{ vars.WP_DEFAULT_CATEGORY_SLUGS }}
          BEFORE_SHA: ${{ github.event.before }}
          ARTICLE_PATH: ${{ inputs.article_path }}
        run: node .github/scripts/publish-wordpress.mjs
