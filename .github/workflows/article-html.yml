name: Build article HTML

on:
  push:
    branches:
      - main
    paths:
      - "articles/*.md"
      - "articles/images/**"
      - ".github/scripts/build-article-html.mjs"
      - ".github/workflows/article-html.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: article-html-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-html:
    name: Generate paste-ready HTML
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out content
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build HTML exports
        run: node .github/scripts/build-article-html.mjs

      - name: Save generated HTML
        run: |
          if [ -z "$(git status --porcelain -- dist)" ]; then
            echo "HTML exports are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "Generate article HTML exports"
          git push

      - name: Prepare GitHub Pages artifact
        run: |
          mkdir -p pages
          cp -R dist pages/dist
          if [ -d articles/images ]; then
            mkdir -p pages/articles
            cp -R articles/images pages/articles/images
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
